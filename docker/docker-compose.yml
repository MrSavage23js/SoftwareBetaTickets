# Servicios de apoyo para DESARROLLO en equipos con Docker (Linux/macOS o Windows con Docker Desktop).
# Sin Docker usa: npm run db:local -- instalar
#
#   docker compose -f docker/docker-compose.yml up -d
#
# PostgreSQL queda en 127.0.0.1:5433 (mismos datos de conexión que DATABASE_URL en .env.example).
# Mailpit (opcional, para probar MAIL_TRANSPORT=smtp): SMTP en :1025, bandeja web en http://localhost:8025
#   SMTP_HOST=127.0.0.1  SMTP_PORT=1025  SMTP_SECURE=false  (sin usuario)
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_DB: mesa_ayuda
      POSTGRES_USER: mesa_app
      POSTGRES_PASSWORD: mesa_dev_123
      TZ: UTC
    volumes:
      - pg-datos:/var/lib/postgresql/data
      - ./pg-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'mesa_app', '-d', 'mesa_ayuda']
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  pg-datos:
