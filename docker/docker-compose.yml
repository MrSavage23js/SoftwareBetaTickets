# Servicios de apoyo para DESARROLLO en equipos con Docker (Linux/macOS o Windows con Docker Desktop).
# En Windows sin Docker usa: npm run db:local -- instalar
#
#   docker compose -f docker/docker-compose.yml up -d
#
# MySQL queda en 127.0.0.1:3307 (mismos datos de conexión que .env.example).
# Mailpit (opcional, para probar MAIL_TRANSPORT=smtp): SMTP en :1025, bandeja web en http://localhost:8025
#   SMTP_HOST=127.0.0.1  SMTP_PORT=1025  SMTP_SECURE=false  (sin usuario)
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_123
      MYSQL_DATABASE: mesa_ayuda
      MYSQL_USER: mesa_app
      MYSQL_PASSWORD: mesa_dev_123
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-datos:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot_dev_123']
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  mysql-datos:
